        <form class="msg-form" data-demo novalidate>
          <label for="f-name-{{id}}">Full Name</label>
          <input id="f-name-{{id}}" type="text" placeholder="Enter your first and last name" autocomplete="name">
          <label for="f-email-{{id}}">Email Address <span class="req">*</span></label>
          <input id="f-email-{{id}}" type="email" placeholder="Enter your email address" autocomplete="email" required>
          <label for="f-msg-{{id}}">Message</label>
          <textarea id="f-msg-{{id}}" placeholder="Message"></textarea>
          <button type="submit">Submit <svg class="arr"><use href="#i-arr"/></svg></button>
          <p class="note" aria-live="polite"></p>
        </form>
